<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud-system</title>


    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>



    <section class="m-4">

        <div class="container-fluid text-center bg-info mx-auto w-75 position-relative">

            <div class="m-2">
                <h2>Crud System</h2>
            </div>


            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="ProductName" placeholder="name@example.com">
                <label for="ProductName">Product Name </label>
            </div>

            <div class="form-floating mb-3">
                <input type="number" class="form-control" id="ProductPrice" placeholder="name@example.com">
                <label for="ProductPrice">Product Price</label>
            </div>


            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="ProductCategory" placeholder="name@example.com">
                <label for="ProductCategory">Product Category</label>
            </div>


            <div class="form-floating mb-3">
                <textarea type="email" class="form-control" id="ProductDescription"
                    placeholder="name@example.com"></textarea>
                <label for="ProductDescription">Product Description</label>
            </div>




            <div class="form-floating mb-3">
                <input type="file" class="form-control" id="ProductImage" placeholder="name@example.com">
                <label for="ProductImage">Product Image</label>
            </div>



            <button  onclick="addProduct()" class="come p-1 bg-primary rounded-3 m-2">
                add product
            </button>


        </div>




    </section>




    <div id="row-special" class="row">

    


  

  </div>



 


  </div>

    <script src="js/main.js"></script>
</body>

</html>
